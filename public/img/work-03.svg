<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="静音 TNT 复制机 占位图">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1a1f"/>
      <stop offset="1" stop-color="#101015"/>
    </linearGradient>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2a2e37" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <rect width="800" height="500" fill="url(#g3)" opacity=".5"/>
  <ellipse cx="400" cy="424" rx="290" ry="44" fill="#000" opacity=".32"/>

  <path d="M110 404 400 264l290 140-290 150z" fill="#23262d"/>
  <path d="M110 404 400 264l290 140" fill="none" stroke="#2f343d" stroke-width="2"/>

  <!-- TNT 方块 -->
  <g>
    <path d="M330 374h140v-30H330z" fill="#c94b4b"/>
    <path d="M330 344h140l18-11H348z" fill="#e05c5c"/>
    <path d="M470 344l18-11v30l-18 11z" fill="#9c3838"/>
    <rect x="330" y="358" width="140" height="4" fill="#f2f2f2" opacity=".85"/>
    <text x="360" y="372" fill="#2b2b2b" font-family="Consolas, monospace" font-size="16" font-weight="700">TNT</text>
  </g>

  <!-- 活塞与推动结构 -->
  <g>
    <path d="M300 320h40v40h-40z" fill="#6f757f"/>
    <path d="M300 320h40l14-9h-40z" fill="#8b919b"/>
    <path d="M340 320l14-9v40l-14 9z" fill="#565b64"/>
    <path d="M462 320h38v40h-38z" fill="#6f757f"/>
    <path d="M462 320h38l14-9h-38z" fill="#8b919b"/>
    <path d="M500 320l14-9v40l-14 9z" fill="#565b64"/>
  </g>

  <!-- 计时器 + 红石 -->
  <g stroke="#ff4b4b" stroke-width="3" fill="none" opacity=".85">
    <path d="M240 400h60v-80"/>
    <path d="M560 400h-60v-80"/>
  </g>
  <g fill="#4a4f59">
    <rect x="226" y="388" width="28" height="24" rx="3"/>
    <rect x="546" y="388" width="28" height="24" rx="3"/>
  </g>
  <circle cx="240" cy="400" r="5" fill="#ff4b4b"/>
  <circle cx="560" cy="400" r="5" fill="#ff4b4b"/>

  <text x="42" y="70" fill="#e8eaed" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600">静音 TNT 复制机</text>
  <text x="42" y="100" fill="#9aa0a6" font-family="Segoe UI, sans-serif" font-size="14">原型占位图 · 上线时替换为你的实拍 / 渲染图</text>
</svg>
