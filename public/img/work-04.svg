<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="16×16 全自动农田 占位图">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d1f"/>
      <stop offset="1" stop-color="#0e1315"/>
    </linearGradient>
    <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2a2e37" stroke-width="1"/>
    </pattern>
    <pattern id="crop4" width="28" height="20" patternUnits="userSpaceOnUse">
      <path d="M14 2v10M6 12l8-10 8 10" fill="none" stroke="#8fbf5a" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <rect width="800" height="500" fill="url(#g4)" opacity=".5"/>
  <ellipse cx="400" cy="432" rx="330" ry="44" fill="#000" opacity=".28"/>

  <!-- 农田地块（16×16 俯视网格） -->
  <g>
    <path d="M170 386 400 270l230 116-230 124z" fill="#3b2f24"/>
    <path d="M170 386 400 270v0l230 116" fill="none" stroke="#4a3a2c" stroke-width="2"/>
    <path d="M200 380 400 278l200 102-200 108z" fill="#2f3a22"/>
    <path d="M200 380 400 278l200 102-200 108z" fill="url(#crop4)" opacity=".85"/>
    <g stroke="#26301c" stroke-width="1" opacity=".7">
      <path d="M250 378 400 300l150 78"/>
      <path d="M300 402 400 352l100 50"/>
      <path d="M225 390 400 272l175 118"/>
    </g>
  </g>

  <!-- 中央水源 -->
  <path d="M388 384h24v-24h-24z" fill="#2f6fbf" opacity=".85"/>

  <!-- 收集漏斗链 -->
  <g fill="#5c6270">
    <path d="M436 402h26v22h-26z"/>
    <path d="M436 402h26l10-6h-26z" fill="#767d8b"/>
    <path d="M462 402l10-6v22l-10 6z" fill="#464b56"/>
  </g>

  <!-- 红石时钟 -->
  <g stroke="#ff4b4b" stroke-width="3" fill="none" opacity=".85">
    <path d="M300 440h-80v-70"/>
    <path d="M500 440h80v-70"/>
  </g>
  <circle cx="300" cy="440" r="5" fill="#ff4b4b"/>
  <circle cx="500" cy="440" r="5" fill="#ff4b4b"/>

  <text x="42" y="70" fill="#e8eaed" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600">16×16 全自动农田</text>
  <text x="42" y="100" fill="#9aa0a6" font-family="Segoe UI, sans-serif" font-size="14">原型占位图 · 上线时替换为你的实拍 / 渲染图</text>
</svg>
