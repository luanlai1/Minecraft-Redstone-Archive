<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="红石灯阵批量点亮装置 占位图">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1720"/>
      <stop offset="1" stop-color="#0f0d14"/>
    </linearGradient>
    <pattern id="g6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2a2e37" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow6">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg6)"/>
  <rect width="800" height="500" fill="url(#g6)" opacity=".5"/>

  <!-- 地面 -->
  <path d="M120 392 400 254l280 138-280 148z" fill="#23262d"/>
  <path d="M120 392 400 254l280 138" fill="none" stroke="#2f343d" stroke-width="2"/>

  <!-- 12x12 灯阵（用点阵示意，中心最亮） -->
  <g>
    <g fill="#ffb020" opacity=".18">
      <rect x="250" y="322" width="300" height="120" rx="8"/>
    </g>
    <g fill="#ffb020">
      <rect x="300" y="360" width="18" height="18" rx="3" opacity=".35"/>
      <rect x="340" y="360" width="18" height="18" rx="3" opacity=".55"/>
      <rect x="380" y="360" width="18" height="18" rx="3" opacity=".8"/>
      <rect x="420" y="360" width="18" height="18" rx="3" opacity=".8"/>
      <rect x="460" y="360" width="18" height="18" rx="3" opacity=".55"/>
      <rect x="320" y="392" width="18" height="18" rx="3" opacity=".45"/>
      <rect x="360" y="392" width="18" height="18" rx="3" opacity=".75"/>
      <rect x="400" y="392" width="18" height="18" rx="3" opacity="1"/>
      <rect x="440" y="392" width="18" height="18" rx="3" opacity=".75"/>
      <rect x="480" y="392" width="18" height="18" rx="3" opacity=".45"/>
      <rect x="340" y="424" width="18" height="18" rx="3" opacity=".35"/>
      <rect x="380" y="424" width="18" height="18" rx="3" opacity=".55"/>
      <rect x="420" y="424" width="18" height="18" rx="3" opacity=".55"/>
      <rect x="460" y="424" width="18" height="18" rx="3" opacity=".35"/>
    </g>
    <circle cx="410" cy="402" r="70" fill="url(#glow6)"/>
  </g>

  <!-- 中继器分级延迟 -->
  <g fill="#4a4f59">
    <rect x="216" y="386" width="26" height="20" rx="3"/>
    <rect x="558" y="386" width="26" height="20" rx="3"/>
    <rect x="386" y="452" width="26" height="20" rx="3"/>
  </g>
  <g stroke="#ff4b4b" stroke-width="3" fill="none" opacity=".85">
    <path d="M242 396h44v-20"/>
    <path d="M558 396h-44v-20"/>
    <path d="M399 452v-24"/>
  </g>
  <circle cx="256" cy="300" r="8" fill="#ff4b4b"/>
  <rect x="404" y="230" width="10" height="26" rx="3" fill="#4a4f59"/>

  <text x="42" y="70" fill="#e8eaed" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600">红石灯阵批量点亮装置</text>
  <text x="42" y="100" fill="#9aa0a6" font-family="Segoe UI, sans-serif" font-size="14">原型占位图 · 上线时替换为你的实拍 / 渲染图</text>
</svg>
