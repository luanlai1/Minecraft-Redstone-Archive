<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="静音可堆叠活塞门 占位图">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f27"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2a2e37" stroke-width="1"/>
    </pattern>
    <linearGradient id="face1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a44"/>
      <stop offset="1" stop-color="#6d4433"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#g1)" opacity=".55"/>
  <ellipse cx="400" cy="430" rx="330" ry="52" fill="#000" opacity=".28"/>

  <!-- 地面石板 -->
  <g opacity=".9">
    <path d="M120 430 400 300l280 130-280 150z" fill="#23272f"/>
    <path d="M120 430 400 300v0l280 130" fill="none" stroke="#2f343d" stroke-width="2"/>
  </g>

  <!-- 3 层堆叠活塞门 -->
  <g>
    <!-- 底层 -->
    <path d="M250 360h180v46H250z" fill="url(#face1)"/>
    <path d="M250 360h180l24-14H274z" fill="#a06b50"/>
    <path d="M430 360l24-14v46l-24 14z" fill="#5b382a"/>
    <rect x="300" y="372" width="80" height="22" rx="3" fill="#3a3f4a"/>
    <circle cx="312" cy="383" r="4" fill="#ff4b4b"/>
    <!-- 中层 -->
    <path d="M266 306h180v46H266z" fill="url(#face1)"/>
    <path d="M266 306h180l24-14H290z" fill="#a06b50"/>
    <path d="M446 306l24-14v46l-24 14z" fill="#5b382a"/>
    <rect x="316" y="318" width="80" height="22" rx="3" fill="#3a3f4a"/>
    <circle cx="328" cy="329" r="4" fill="#ff4b4b"/>
    <!-- 顶层 -->
    <path d="M282 252h180v46H282z" fill="url(#face1)"/>
    <path d="M282 252h180l24-14H306z" fill="#a06b50"/>
    <path d="M462 252l24-14v46l-24 14z" fill="#5b382a"/>
    <rect x="332" y="264" width="80" height="22" rx="3" fill="#3a3f4a"/>
    <circle cx="344" cy="275" r="4" fill="#ff4b4b"/>
  </g>

  <!-- 隐藏红石线 -->
  <g stroke="#ff4b4b" stroke-width="3" fill="none" opacity=".8">
    <path d="M196 300h56v100"/>
    <path d="M604 300h-56v100"/>
    <path d="M252 400h80M468 400h80"/>
  </g>
  <rect x="188" y="284" width="16" height="16" rx="3" fill="#ff4b4b"/>
  <rect x="596" y="284" width="16" height="16" rx="3" fill="#ff4b4b"/>

  <text x="42" y="70" fill="#e8eaed" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600">静音可堆叠活塞门</text>
  <text x="42" y="100" fill="#9aa0a6" font-family="Segoe UI, sans-serif" font-size="14">原型占位图 · 上线时替换为你的实拍 / 渲染图</text>
</svg>
