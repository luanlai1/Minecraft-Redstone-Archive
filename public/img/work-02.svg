<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="3×3 无痕活塞门 占位图">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d26"/>
      <stop offset="1" stop-color="#0f1219"/>
    </linearGradient>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2a2e37" stroke-width="1"/>
    </pattern>
    <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5138"/>
      <stop offset="1" stop-color="#5f3c29"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#g2)" opacity=".5"/>
  <ellipse cx="400" cy="420" rx="300" ry="46" fill="#000" opacity=".3"/>

  <!-- 地板 -->
  <path d="M110 400 400 260l290 140-290 150z" fill="#222630"/>
  <path d="M110 400 400 260l290 140" fill="none" stroke="#2e333d" stroke-width="2"/>

  <!-- 3x3 门体收起状态（与地板齐平的缝隙） -->
  <g>
    <path d="M310 392h180v-72H310z" fill="url(#wood2)"/>
    <path d="M310 320h180l20-12H330z" fill="#8d5f42"/>
    <path d="M490 320l20-12v72l-20 12z" fill="#4f3222"/>
    <g stroke="#3b271c" stroke-width="2" opacity=".8">
      <path d="M370 320v72M430 320v72M310 356h180"/>
    </g>
  </g>

  <!-- 隐藏布线（从下方穿出） -->
  <g stroke="#ff4b4b" stroke-width="3" fill="none" opacity=".85">
    <path d="M180 452h140v-96"/>
    <path d="M620 452H480v-96"/>
  </g>
  <rect x="172" y="444" width="16" height="16" rx="3" fill="#ff4b4b"/>
  <rect x="612" y="444" width="16" height="16" rx="3" fill="#ff4b4b"/>

  <!-- 拉杆 -->
  <g>
    <rect x="394" y="196" width="12" height="26" rx="3" fill="#4a4f59"/>
    <circle cx="400" cy="192" r="8" fill="#ff4b4b"/>
  </g>

  <text x="42" y="70" fill="#e8eaed" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600">3×3 无痕活塞门</text>
  <text x="42" y="100" fill="#9aa0a6" font-family="Segoe UI, sans-serif" font-size="14">原型占位图 · 上线时替换为你的实拍 / 渲染图</text>
</svg>
